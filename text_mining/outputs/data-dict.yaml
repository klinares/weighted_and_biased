# data-dict.yaml (spec: https://data-dict.tidyverse.org/)
# Generated by llm_stance.qmd; edit the script, not this file.
name: public_comment_stance
description: "STM topics over a paragraph corpus of public comments, LLM topic labels, and design-based stance estimates from a stratified two-stage sample."
version: 2026-08-05
tables:
  - name: topic_codebook
    path: D:/repos/weighted_and_biased/text_mining/outputs/topic_codebook.csv
    description: "One row per STM topic: LLM label and description plus the STM evidence. Analyst-editable; the naming record for coders."
    rows: 25
    variables:
      - name: topic
        type: integer
        description: "STM topic number"
      - name: label
        type: string
        description: "Short human-readable name (analyst-editable)"
      - name: description
        type: string
        description: "One factual sentence describing the topic"
      - name: prevalence
        type: double
        description: "Mean theta over all corpus paragraphs"
      - name: n_paras
        type: integer
        description: "Paragraphs whose modal topic is this topic"
      - name: avepp
        type: double
        description: "Average posterior probability among assigned paragraphs; below 0.7 indicates fuzzy assignment"
      - name: frex
        type: string
        description: "Frequent-and-exclusive terms from STM"
  - name: topic_propositions
    path: D:/repos/weighted_and_biased/text_mining/outputs/topic_propositions.csv
    description: "Stance targets for the selected topics. The proposition column is the analyst's decision and is quoted verbatim in every stance prompt."
    rows: 3
    variables:
      - name: topic
        type: integer
        description: "STM topic number"
      - name: label
        type: string
        description: "Topic label"
      - name: proposition
        type: string
        description: "The contestable claim stance is measured toward"
      - name: alt_1
        type: string
        description: "Alternative draft"
      - name: alt_2
        type: string
        description: "Alternative draft"
  - name: sample_paragraphs
    path: D:/repos/weighted_and_biased/text_mining/outputs/sample_paragraphs.csv
    description: "The realized probability sample: paragraphs drawn within selected topics, with design quantities."
    rows: 477
    variables:
      - name: para_uid
        type: string
        description: "Paragraph id, atom_id-para_id"
      - name: atom_id
        type: string
        description: "Comment id; the sampling cluster (PSU)"
      - name: Year
        type: integer
        description: "Comment year; the sampling stratum"
      - name: n_tokens
        type: integer
        description: "Whitespace token count"
      - name: text
        type: string
        description: "Paragraph text"
      - name: topic
        type: integer
        description: "Modal STM topic"
      - name: theta_max
        type: double
        description: "Modal topic's theta"
      - name: m_i
        type: integer
        description: "Paragraphs in the comment"
      - name: N_h
        type: integer
        description: "Comments in the year stratum"
      - name: n_h
        type: integer
        description: "Comments sampled in the stratum"
      - name: pi1
        type: double
        description: "Stage-1 inclusion probability"
      - name: pi2
        type: double
        description: "Stage-2 inclusion probability"
      - name: pi
        type: double
        description: "Overall inclusion probability"
      - name: w
        type: double
        description: "Design weight, 1/pi"
      - name: p_opp
        type: double
        description: "SIMULATION ONLY: planted P(oppose)"
      - name: true_stance
        type: string
        description: "SIMULATION ONLY: planted stance"
  - name: stance_labels
    path: D:/repos/weighted_and_biased/text_mining/outputs/stance_labels.csv
    description: "One row per sampled paragraph per rater model."
    rows: 954
    variables:
      - name: para_uid
        type: string
        description: "Paragraph id"
      - name: model
        type: string
        description: "Rater model key"
      - name: stance
        type: string
        description: "favor, neutral, oppose, or irrelevant"
  - name: gold_to_code
    path: D:/repos/weighted_and_biased/text_mining/outputs/gold_to_code.csv
    description: "Blank human-coding template: the coder sees the same evidence the model saw and no model output."
    rows: 300
    variables:
      - name: para_uid
        type: string
        description: "Paragraph id"
      - name: topic
        type: integer
        description: "STM topic number"
      - name: topic_label
        type: string
        description: "Topic label"
      - name: topic_description
        type: string
        description: "Topic description"
      - name: proposition
        type: string
        description: "The claim to code stance toward"
      - name: text
        type: string
        description: "Paragraph text"
      - name: human_label
        type: string
        description: "TO BE FILLED by the coder"
      - name: coder_notes
        type: string
        description: "Free-text notes"
  - name: stance_trends
    path: D:/repos/weighted_and_biased/text_mining/outputs/stance_trends.csv
    description: "Design-based fitted P(oppose) by year and topic with 95 percent interval bounds."
    rows: 78
    variables:
      - name: Year
        type: integer
        description: "Calendar year"
      - name: label
        type: string
        description: "Topic label"
      - name: fit
        type: double
        description: "Fitted P(oppose) from svyglm"
      - name: lo
        type: double
        description: "Lower 95% bound"
      - name: hi
        type: double
        description: "Upper 95% bound"
relationships:
  - sample_paragraphs.para_uid is a subset of paragraph_theta.para_uid (Script 1)
  - stance_labels.para_uid joins sample_paragraphs.para_uid, many-to-one across models
  - topic_propositions.topic and topic_codebook.topic join on the STM topic number
glossary:
  - term: "theta"
    definition: "STM's posterior topic proportions for a paragraph; rows sum to 1."
  - term: "modal topic"
    definition: "The topic with the highest theta; assignment is an estimate, not an observation, so it carries classification error."
  - term: "entropy R2"
    definition: "Overall sharpness of modal assignment on a 0-1 scale, as in latent class analysis."
  - term: "AvePP"
    definition: "Average posterior probability among a topic's assigned paragraphs; about 0.7 is the conventional floor."
  - term: "stance"
    definition: "Position toward a stated proposition (favor, neutral, oppose) or irrelevant; distinct from sentiment."
  - term: "proposition"
    definition: "The contestable claim stance is measured toward; analyst-authored."
  - term: "design weight"
    definition: "1/pi, the number of corpus paragraphs a sampled paragraph represents."
  - term: "deff"
    definition: "Design effect; here 1+(b-1)rho from sampling several paragraphs per comment."

